name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  PROJECT_ID: angelic-throne-502610-v3
  REGION: us-central1
  SERVICE_NAME: impostoi
  ARTIFACT_REPOSITORY: impostoi-registry

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          DATABASE_URL_PROD: ${{ secrets.DATABASE_URL_PROD }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PORTAL_KEY: ${{ secrets.NEXT_PUBLIC_PORTAL_KEY }}
        run: |
          for required in \
            WORKLOAD_IDENTITY_PROVIDER \
            DEPLOYER_SERVICE_ACCOUNT \
            DATABASE_URL_PROD \
            APP_URL \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            PORTAL_KEY; do
            test -n "${!required}" || { echo "Missing deployment configuration: $required"; exit 1; }
          done

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      - name: Create Artifact Registry repository
        run: |
          gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --location="$REGION" \
            --project="$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" \
            --repository-format=docker \
            --location="$REGION" \
            --project="$PROJECT_ID"

      - name: Configure Docker
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}
        run: |
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL_PROD"; exit 1; }
          supabase db push --db-url "$DATABASE_URL"

      - name: Deploy Cloud Run service
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PORTAL_KEY: ${{ secrets.NEXT_PUBLIC_PORTAL_KEY }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "NODE_ENV=production,NEXT_PUBLIC_APP_URL=$APP_URL,NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_PORTAL_KEY=$PORTAL_KEY,OPENCODE_ZEN_BASE_URL=https://opencode.ai/zen/v1,OPENCODE_MODEL=mimo-v2.5-free" \
            --set-secrets "SUPABASE_SECRET_KEY=impostoi-supabase-secret-key:latest,PORTAL_SECRET=impostoi-portal-secret:latest,OPENCODE_ZEN_API_KEY=impostoi-opencode-zen-key:latest"

      - name: Show deployment URL
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)'

      - name: Remove temporary Google credentials
        if: ${{ always() }}
        run: rm -f gha-creds-*.json
